<h4>Add New Hotel</h4>
<form (ngSubmit)="submitHotel()" class="mt-3">
  <div class="mb-3">
    <label>Name</label>
    <input class="form-control" [(ngModel)]="hotel.name" name="name" required>
  </div>
  <div class="mb-3">
    <label>Price</label>
    <input class="form-control" [(ngModel)]="hotel.price" name="price" required>
  </div>
  <div class="mb-3">
    <label>Address</label>
    <input class="form-control" [(ngModel)]="hotel.address" name="address" required>
  </div>
  <div class="mb-3">
    <label>Rooms</label>
    <input class="form-control" [(ngModel)]="hotel.rooms" name="rooms" required>
  </div>
  <div class="mb-3">
    <label>Amenities</label><br>
    <label><input type="checkbox" [(ngModel)]="hotel.amenities.bathroom" name="bathroom"> Bathroom</label>
    <label><input type="checkbox" [(ngModel)]="hotel.amenities.ac" name="ac"> AC</label>
    <label><input type="checkbox" [(ngModel)]="hotel.amenities.wifi" name="wifi"> WiFi</label>
  </div>
  <div class="mb-3">
    <label>Image</label>
    <input type="file" class="form-control" (change)="onFileChange($event)">
  </div>
  <button class="btn btn-success" type="submit">Add Hotel</button>
</form>
