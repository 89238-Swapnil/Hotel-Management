<div class="container mt-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Create Account</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Username -->
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" type="text" class="form-control" formControlName="username">
      <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="text-danger">
        Username is required.
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email">
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger">
        Enter a valid email.
      </div>
    </div>

    <!-- Phone -->
    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input id="phone" type="text" class="form-control" formControlName="phone">
      <div *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched" class="text-danger">
        Phone number is required.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password">
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-danger">
        Password is required.
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Sign Up</button>
  </form>

  <div class="mt-3 text-center">
    <a routerLink="/login">Already have an account? Log in</a>
  </div>
</div>
