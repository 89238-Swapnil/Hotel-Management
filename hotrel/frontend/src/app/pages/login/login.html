<div class="container mt-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Log In</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Username -->
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" type="text" class="form-control" formControlName="username">
      <div *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="text-danger">
        Username is required.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password">
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-danger">
        Password is required.
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Log In</button>
  </form>

  <div class="mt-3 text-center">
    <p>Don't have an account?</p>
    <a routerLink="/signup" class="btn btn-outline-secondary">Sign Up</a>
  </div>
</div>
